<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minijuegos</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="assets/logos/robot.svg">
</head>
<body class="home">
<header class="hero">
  <h1>Mini<span>juegos</span></h1>
  <p class="tagline">Elige un juego y rompe tu récord.</p>
</header>
<nav class="menu" aria-label="Juegos">
  <a class="game" href="canon/canon.html" style="--accent:#3f9de6">
    <img class="logo" src="assets/logos/canon.svg" alt="">
    <span class="text"><b>Vuelo en el Cañón</b><span>Esquiva las columnas</span></span>
    <span class="best"><small>Récord</small><span id="canon">0</span></span>
  </a>
  <a class="game" href="pong/pong.html" style="--accent:#f2f3f7">
    <img class="logo" src="assets/logos/pong.svg" alt="">
    <span class="text"><b>Pong</b><span>Devuelve la pelota al techo</span></span>
    <span class="best"><small>Récord</small><span id="pong">0</span></span>
  </a>
  <a class="game" href="submarino/submarino.html" style="--accent:#ffca28">
    <img class="logo" src="assets/logos/submarino.svg" alt="">
    <span class="text"><b>Submarino</b><span>Pasa entre las rocas del fondo</span></span>
    <span class="best"><small>Récord</small><span id="submarino">0</span></span>
  </a>
  <a class="game" href="robot/robot.html" style="--accent:#e5252a">
    <img class="logo" src="assets/logos/robot.svg" alt="">
    <span class="text"><b>Robot Veloz</b><span>Salta las vallas en la pista</span></span>
    <span class="best"><small>Récord</small><span id="robot">0</span></span>
  </a>
</nav>
<script src="common.js"></script>
<script>
for (const k of ['canon', 'pong', 'submarino', 'robot']) document.getElementById(k).textContent = loadBest(k);
</script>
</body>
</html>
