<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minijuegos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Mini<span>juegos</span></h1>
<p class="tagline">Elige un juego y rompe tu récord.</p>
<div class="menu">
  <a class="card" href="cueva/cueva.html">
    <div class="thumb cueva"><img src="assets/cueva-avioneta.png" alt=""></div>
    <div class="info"><b>Vuelo en el Cañón</b><span>Esquiva las columnas de roca</span><small>Récord: <span id="cueva" style="display:inline;margin:0;color:inherit;font-size:inherit">0</span></small></div>
  </a>
  <a class="card" href="pong/pong.html">
    <div class="thumb pong"><img src="assets/pong-celular.png" alt=""></div>
    <div class="info"><b>Pong</b><span>Devuelve la pelota al techo</span><small>Récord: <span id="pong" style="display:inline;margin:0;color:inherit;font-size:inherit">0</span></small></div>
  </a>
  <a class="card" href="submarino/submarino.html">
    <div class="thumb submarino"><img src="assets/submarino.png" alt=""></div>
    <div class="info"><b>Submarino</b><span>Pasa entre las rocas del fondo</span><small>Récord: <span id="submarino" style="display:inline;margin:0;color:inherit;font-size:inherit">0</span></small></div>
  </a>
  <a class="card" href="zorro/zorro.html">
    <div class="thumb zorro"><img src="assets/zorro-robot.png" alt=""></div>
    <div class="info"><b>Robot Veloz</b><span>Salta las vallas en la pista</span><small>Récord: <span id="zorro" style="display:inline;margin:0;color:inherit;font-size:inherit">0</span></small></div>
  </a>
</div>
<script src="common.js"></script>
<script>
for (const k of ['cueva', 'pong', 'submarino', 'zorro']) document.getElementById(k).textContent = loadBest(k);
</script>
</body>
</html>
