<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dino Runner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="index.html">← Menú</a>
<canvas id="c" width="600" height="200" style="background:#f7f7f7"></canvas>
<p>Espacio / ↑ / toque para saltar</p>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
const W = c.width, GROUND = 170;
let dino, obs, speed, score, over, frame;

function reset() {
  dino = { y: GROUND - 30, v: 0 };
  obs = []; speed = 5; score = 0; over = false; frame = 0;
}

function jump() {
  if (over) return reset();
  if (dino.y >= GROUND - 30) dino.v = -11;
}

addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
});
c.addEventListener('pointerdown', jump);

function update() {
  if (over) return;
  dino.v += 0.6;
  dino.y = Math.min(GROUND - 30, dino.y + dino.v);
  if (dino.y === GROUND - 30) dino.v = 0;
  if (frame++ % Math.max(40, Math.floor(110 - speed * 4)) === 0 && Math.random() < 0.8)
    obs.push({ x: W, w: 15 + Math.random() * 15, h: 25 + Math.random() * 20 });
  for (const o of obs) {
    o.x -= speed;
    if (30 + 28 > o.x && 30 < o.x + o.w && dino.y + 30 > GROUND - o.h) over = true;
  }
  obs = obs.filter(o => o.x > -o.w);
  speed += 0.002;
  score += speed / 30;
}

function draw() {
  g.clearRect(0, 0, W, 200);
  g.fillStyle = '#333';
  g.fillRect(0, GROUND, W, 2);
  g.fillRect(30, dino.y, 28, 30);
  g.fillStyle = '#2e7d32';
  for (const o of obs) g.fillRect(o.x, GROUND - o.h, o.w, o.h);
  g.fillStyle = '#333'; g.font = '18px monospace'; g.textAlign = 'right';
  g.fillText(String(Math.floor(score)).padStart(5, '0'), W - 10, 25);
  if (over) {
    g.textAlign = 'center'; g.font = '28px sans-serif';
    g.fillText('Game Over', W / 2, 80);
    g.font = '16px sans-serif';
    g.fillText('Salta para reiniciar', W / 2, 105);
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
reset(); loop();
</script>
</body>
</html>
